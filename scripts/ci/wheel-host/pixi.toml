[workspace]
authors = ["Rohit Goswami <rgoswami@ieee.org>"]
channels = ["conda-forge"]
name = "eon-wheel-host"
platforms = ["win-64"]
version = "0.0.0"

# Host tools for the Windows cibuildwheel job. The runner's MinGW gfortran
# and Strawberry pkg-config break Meson's CMake probe, so Eigen is never
# found. This env is the same trio the Windows test job already uses.
[dependencies]
eigen = ">=3.4,<3.5"
pkg-config = ">=0.29.2,<0.30"
# The relax engine compiles schema/eon_relax_engine.capnp.
capnproto = ">=1.0,<2"
# flang 20 rejects -Werror=implicit-function-declaration, so rgpot's
# find_library probes never see FortranRuntime. The Windows test job
# uses the 19.1.7 pin from the main lock.
flang = ">=19.1.7,<20"
quill = ">=11.0.2,<12"
# The umbrella staticlib needs rustc >= 1.88 (readcon-core is edition 2024).
rust = ">=1.88"
