[Main]
job = nudged_elastic_band
# Each CPMD call launches MPI ranks; evaluate images sequentially.
parallel = false

[Potential]
potential = ext_pot
ext_pot_path = ./ext_pot

[Nudged Elastic Band]
images = 5
spring = 1.0
climbing_image_method = true
converged_force = 0.05
max_iterations = 500

[Optimizer]
opt_method = lbfgs
max_move = 0.05
