; Periodic H2 point. scripts/ci/opencpmd_point.sh rewrites the bond length
; when BOND_LENGTHS is set. The cell stays this 10 Angstrom cube.
; Pseudopotential: pseudo/H_GTH_BLYP (Goedecker-Teter-Hutter, BLYP).
[Main]
job = point
random_seed = 1

[Potential]
potential = ext_pot
ext_pot_path = @EXT_POT@
