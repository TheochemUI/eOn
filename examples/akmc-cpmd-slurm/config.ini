[Main]
job = akmc
temperature = 300
random_seed = 42

[Potential]
potential = ext_pot
ext_pot_path = ./ext_pot

[Paths]
potential_files = ./potfiles

[Communicator]
type = cluster
script_path = /path/to/eon/tools/clusters/slurm
name_prefix = si7cpmd
num_jobs = 2
max_jobs = 2

[AKMC]
confidence = 0.3
max_kmc_steps = 1

[Saddle Search]
method = min_mode
min_mode_method = dimer
displace_least_coordinated_weight = 1.0
displace_radius = 2.6
displace_magnitude = 0.1
max_energy = 5.0
max_iterations = 150

[Optimizer]
opt_method = lbfgs
converged_force = 0.05
max_iterations = 150

[Prefactor]
default_value = 1e12
