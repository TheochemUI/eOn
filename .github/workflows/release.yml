---
concurrency:
  cancel-in-progress: false
  group: release-${{ github.ref }}
jobs:
  gate:
    outputs:
      is_prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
        persist-credentials: false
    - id: meta
      name: Tag / version meta
      run: |-
        TAG="${GITHUB_REF#refs/tags/}"
        VERSION="${TAG#v}"
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "Release gate for ${TAG} (${VERSION})"
    - name: Assert lockstep + CHANGELOG section
      run: |-
        VERSION="${{ steps.meta.outputs.version }}"
        python3 scripts/release_assert.py "$VERSION" --require-changelog
        NOTES="${RUNNER_TEMP}/release_notes.md"
        if [[ -f "docs/source/releases/v${VERSION}/release-notes.md" ]]; then
          cp "docs/source/releases/v${VERSION}/release-notes.md" "$NOTES"
        else
          python3 scripts/release_assert.py "$VERSION" --notes "$NOTES"
        fi
        echo "--- release notes (head) ---"
        head -40 "$NOTES" || true
    - name: Upload release notes
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: release-notes-${{ github.sha }}
        path: ${{ runner.temp }}/release_notes.md
        retention-days: 5
    - id: prerelease
      name: Detect pre-release (RC) tag
      run: |-
        VERSION="${{ steps.meta.outputs.version }}"
        if [[ "$VERSION" == *-* ]]; then
          echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          echo "Pre-release: will skip PyPI (stable index only)."
        else
          echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
        fi
  gh-release:
    needs:
    - gate
    - tarball
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - name: Download release notes
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: release-notes-${{ github.sha }}
        path: ${{ runner.temp }}/release-notes
    - name: Download tarball
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: eon-tarball-${{ needs.gate.outputs.version }}
        path: ${{ runner.temp }}/tarball
    - env:
        GH_TOKEN: ${{ github.token }}
        IS_PRE: ${{ needs.gate.outputs.is_prerelease }}
        TAG: ${{ needs.gate.outputs.tag }}
        VERSION: ${{ needs.gate.outputs.version }}
      name: Create or update GitHub Release
      run: |-
        set -euo pipefail
        ASSET="${RUNNER_TEMP}/tarball/eon-v${VERSION}.tar.xz"
        NOTES="${RUNNER_TEMP}/release-notes/release_notes.md"
        PRE_FLAG=()
        if [[ "$IS_PRE" == "true" ]]; then
          PRE_FLAG=(--prerelease)
        fi
        if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
          echo "Release $TAG exists; ensuring notes/asset..."
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file "$NOTES" "${PRE_FLAG[@]}"
          gh release upload "$TAG" "$ASSET" --repo "${{ github.repository }}" --clobber
        else
          gh release create "$TAG" "$ASSET" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes-file "$NOTES" \
            "${PRE_FLAG[@]}"
        fi
  pypi:
    environment:
      name: release
      url: https://pypi.org/p/eon-akmc
    if: needs.gate.outputs.is_prerelease != 'true'
    needs:
    - gate
    - tarball
    - gh-release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install build frontend
      run: python3 -m pip install --upgrade pip build
    - name: Install sdist build deps
      run: |-
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libeigen3-dev gfortran ninja-build cmake pkg-config zlib1g-dev build-essential
        bash scripts/pyeonclient_manylinux_deps.sh
        echo "/usr/local/lib" | sudo tee /etc/ld.so.conf.d/usr-local.conf
        echo "/usr/local/lib64" | sudo tee -a /etc/ld.so.conf.d/usr-local.conf
        sudo ldconfig
        echo "LD_LIBRARY_PATH=/usr/local/lib64:/usr/local/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
        echo "PKG_CONFIG_PATH=/usr/local/lib64/pkgconfig:/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
        echo "CMAKE_PREFIX_PATH=/usr/local" >> "$GITHUB_ENV"
        pkg-config --modversion quill
    - name: Build sdist (meson-python)
      run: |-
        set -o pipefail
        python3 scripts/release_assert.py "${{ needs.gate.outputs.version }}" --require-changelog
        python3 -m build --sdist 2>&1 | tee "${RUNNER_TEMP}/pypi-build.log"
        ls -la dist/
        test -n "$(find dist -name '*.tar.gz' -print -quit)"
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: true
        verbose: true
  pypi-skip-rc:
    if: needs.gate.outputs.is_prerelease == 'true'
    needs:
    - gate
    - tarball
    - gh-release
    runs-on: ubuntu-latest
    steps:
    - name: Skip PyPI for RC
      run: |-
        echo "Skipped PyPI for pre-release ${{ needs.gate.outputs.tag }}."
        echo "GitHub Release created as prerelease with tarball asset."
  tarball:
    needs:
    - gate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Build source tarball (git archive, not GitHub auto-archive)
      run: |-
        TAG="${{ needs.gate.outputs.tag }}"
        VERSION="${{ needs.gate.outputs.version }}"
        OUT="eon-v${VERSION}.tar.xz"
        git archive --format=tar "$TAG" | xz -9 > "$OUT"
        ls -la "$OUT"
        sha256sum "$OUT" | tee tarball.sha256
    - name: Upload tarball artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: eon-tarball-${{ needs.gate.outputs.version }}
        path: |-
          eon-v${{ needs.gate.outputs.version }}.tar.xz
          tarball.sha256
        retention-days: 30
name: Release
on:
  push:
    tags:
    - v*
permissions:
  contents: read
