name: lints
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
on: [push, pull_request]
jobs:
  lints:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
    - name: Run prek (faster pre-commit)
      run: |
        uvx prek@0.5.3 -a
    # Autonomy: release/prepare/towncrier YAML must match ci/gha/*.ncl (when nickel available).
    - name: GHA nickel drift (release workflows)
      run: |
        set -euo pipefail
        if command -v nickel >/dev/null 2>&1; then
          bash ci/gha/check-drift.sh
        elif command -v pixi >/dev/null 2>&1; then
          pixi r -e cigen gha-drift
        else
          echo "nickel/pixi not on runner; skip gha-drift (enforced on release-prepare + local cigen)"
        fi
    - name: Audit for large files
      uses: HaoZeke/large-file-auditor@073018dbb5800643bbd19b305a7a3cbbd5cd67c0 # v0.1.0
      with:
        file-size-threshold: "3M"
