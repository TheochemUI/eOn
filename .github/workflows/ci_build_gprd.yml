name: Build eOn with GPRD
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/ci_build_gprd.yml"
      - "client/AtomicGPDimer.*"
      - "client/GPRHelpers.*"
      - "client/EigenmodeStrategy.cpp"
      - "client/meson.build"
      - "meson_options.txt"
      - "subprojects/gpr_optim.wrap"
      - "subprojects/gpr_optim/**"
      - "tests/test_one_pt.py"
      - "tests/test_gpr_optim_pin.py"
  pull_request:
    paths:
      - ".github/workflows/ci_build_gprd.yml"
      - "client/AtomicGPDimer.*"
      - "client/GPRHelpers.*"
      - "client/EigenmodeStrategy.cpp"
      - "client/meson.build"
      - "meson_options.txt"
      - "subprojects/gpr_optim.wrap"
      - "subprojects/gpr_optim/**"
      - "tests/test_one_pt.py"
      - "tests/test_gpr_optim_pin.py"
permissions:
  contents: read
env:
  # gpr_optim develop. Same hash as subprojects/gpr_optim.wrap.
  GPR_OPTIM_REV: b55c89e2115388f901839aba2a5808bfcef06f68
jobs:
  gprd-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: GP dimer pin is in the tree
        run: |
          set -euo pipefail
          rev=$(sed -n 's/^revision = //p' subprojects/gpr_optim.wrap)
          test "$rev" = "$GPR_OPTIM_REV"
          test "$(tr -d '[:space:]' < subprojects/gpr_optim/REVISION)" = "$GPR_OPTIM_REV"
          test -f subprojects/gpr_optim/gpr/AtomicDimer.h
      - uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e # v0.9.4
        with:
          cache: true
          cache-write: true
          activate-environment: true
          environments: >-
            dev
      - name: Install cbindgen
        shell: bash
        run: command -v cbindgen || cargo install cbindgen
      - name: Install eon
        shell: pixi run bash -e {0}
        run: |
          # Default options. -Dwith_gprd=auto links the shipped tree on Linux.
          meson setup --reconfigure bbdir  \
          --prefix=$CONDA_PREFIX           \
          --buildtype release              \
          --libdir=lib                     \
          -Dwith_tests=true
          meson install --skip-subprojects -C bbdir
      - name: Morse Pt GP dimer
        shell: pixi run bash -e {0}
        run: |
          python -m pip install -q 'pytest>=8' 'pytest-datadir>=1.5' 'sh>=2'
          python -m pytest \
            tests/test_gpr_optim_pin.py \
            tests/test_one_pt.py::test_morse_pt_gprdimer_matches_dimer_fewer_calls \
            -q
