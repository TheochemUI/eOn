name: Build eOn with GPRD
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/ci_build_gprd.yml"
      - "client/AtomicGPDimer.*"
      - "client/GPRHelpers.*"
      - "client/meson.build"
      - "meson_options.txt"
jobs:
  # Fork PRs do not receive SUBMODULE_PRIVATE. A single job that exits 0
  # after skip reports Success. Split so the integration job is Skipped
  # (not a fake pass) when the secret is missing (eOn-234v).
  gprd-gate:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.gate.outputs.available }}
    steps:
      - name: Check submodule SSH secret
        id: gate
        env:
          SUBMODULE_PRIVATE: ${{ secrets.SUBMODULE_PRIVATE }}
        run: |
          if [ -z "$SUBMODULE_PRIVATE" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "GPRD integration skipped: SUBMODULE_PRIVATE unavailable"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

  gprd-integration:
    needs: gprd-gate
    if: needs.gprd-gate.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup SSH for private submodule
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.SUBMODULE_PRIVATE }}
      - name: Pull GPRD submodule
        run: |
          # develop tip: 26242c8 is not on any branch after gpr_optim history rewrite
          # (git clone then checkout fails with "unable to read tree").
          git clone --branch develop --single-branch \
            git@github.com:TheochemUI/gpr_optim.git subprojects/gpr_optim
          cd subprojects/gpr_optim
          git checkout 365b78bdf4042f75915e1113396e1b4aa50edaa2
          git rev-parse --short HEAD
      - uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e # v0.9.4
        with:
          cache: true
          cache-write: true
          activate-environment: true
          environments: >-
            dev
      - name: Install cbindgen
        shell: bash
        run: command -v cbindgen || cargo install cbindgen
      - name: Install eon with GPRD
        shell: pixi run bash -e {0}
        run: |
          meson setup --reconfigure bbdir  \
          --prefix=$CONDA_PREFIX           \
          --buildtype release              \
          --libdir=lib                     \
          -Dwith_gprd=true                 \
          -Dwith_tests=true
          meson install --skip-subprojects -C bbdir
      - name: Integration Tests
        shell: pixi run bash -e {0}
        run: |
          cd client/unit_tests/data/systems/saddle_search/
          eonclient
