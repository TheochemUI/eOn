name: Build eOn with GPRD
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/ci_build_gprd.yml"
      - "client/AtomicGPDimer.*"
      - "client/GPRHelpers.*"
      - "client/EigenmodeStrategy.cpp"
      - "client/meson.build"
      - "meson_options.txt"
      - "tests/test_one_pt.py"
      - "tests/test_gpr_optim_pin.py"
  pull_request:
    paths:
      - ".github/workflows/ci_build_gprd.yml"
      - "client/AtomicGPDimer.*"
      - "client/GPRHelpers.*"
      - "client/EigenmodeStrategy.cpp"
      - "client/meson.build"
      - "meson_options.txt"
      - "tests/test_one_pt.py"
      - "tests/test_gpr_optim_pin.py"
permissions:
  contents: read
env:
  GPR_OPTIM_REV: b55c89e2115388f901839aba2a5808bfcef06f68
jobs:
  gprd-integration:
    runs-on: ubuntu-latest
    env:
      # gpr_optim is private: the GP dimer job needs a read token for it, and
      # a run without one (a fork, say) builds nothing here.
      HAVE_GPR_OPTIM: ${{ secrets.GPR_OPTIM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: No gpr_optim access
        if: env.HAVE_GPR_OPTIM != 'true'
        run: echo "GPR_OPTIM_TOKEN is not set; the private gpr_optim pin is not checked out and the GP dimer is not built."
      - name: Check out the private gpr_optim pin
        if: env.HAVE_GPR_OPTIM == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: TheochemUI/gpr_optim
          ref: ${{ env.GPR_OPTIM_REV }}
          path: subprojects/gpr_optim
          token: ${{ secrets.GPR_OPTIM_TOKEN }}
          persist-credentials: false
      - name: GP dimer checkout matches the pin
        if: env.HAVE_GPR_OPTIM == 'true'
        run: |
          set -euo pipefail
          test ! -e subprojects/gpr_optim.wrap
          test "$(git -C subprojects/gpr_optim rev-parse HEAD)" = "$GPR_OPTIM_REV"
          test -f subprojects/gpr_optim/gpr/AtomicDimer.h
      - uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e # v0.9.4
        if: env.HAVE_GPR_OPTIM == 'true'
        with:
          cache: true
          cache-write: true
          activate-environment: true
          environments: >-
            dev
      - name: Install cbindgen
        if: env.HAVE_GPR_OPTIM == 'true'
        shell: bash
        run: command -v cbindgen || cargo install cbindgen
      - name: Install eon
        if: env.HAVE_GPR_OPTIM == 'true'
        shell: pixi run bash -e {0}
        run: |
          # Default options. -Dwith_gprd=auto links the checkout on Linux.
          meson setup --reconfigure bbdir  \
          --prefix=$CONDA_PREFIX           \
          --buildtype release              \
          --libdir=lib                     \
          -Dwith_tests=true
          meson install --skip-subprojects -C bbdir
      - name: Morse Pt GP dimer
        if: env.HAVE_GPR_OPTIM == 'true'
        shell: pixi run bash -e {0}
        run: |
          python -m pip install -q 'pytest>=8' 'pytest-datadir>=1.5' 'sh>=2'
          python -m pytest \
            tests/test_gpr_optim_pin.py \
            tests/test_one_pt.py::test_morse_pt_gprdimer_matches_dimer_fewer_calls \
            -q
