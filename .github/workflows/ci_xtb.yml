name: Build and test eonclient with XTB
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build_eon:
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # windows-2022: windows-latest ships VS 18 only and breaks msvc-dev-cmd.
        # Meson writes xtb.lib from libxtb-6.dll (conda-forge ships no MSVC
        # import library). aarch64 macOS is still out.
        # TODO(rg): Macos 12 seems to hang a lot, macos-12
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e # v0.9.4
        with:
          cache: true
          cache-write: true
          # dev-xtb activation prepends PATH; setup-pixi refuses that on
          # Windows. Named-env `pixi run` is the activate path.
          activate-environment: false
          environments: >-
            dev-xtb
      - name: Install cbindgen
        shell: bash
        run: command -v cbindgen || cargo install cbindgen
      - name: Activate MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
          vsversion: "2022"
      - name: Install eon [unix]
        if: runner.os != 'Windows'
        shell: pixi run -e dev-xtb bash -e {0}
        run: |
          meson setup --reconfigure bbdir  \
          --prefix=$CONDA_PREFIX           \
          --buildtype release              \
          --libdir=lib                     \
          -Dwith_xtb=True            \
          -Dwith_tests=True
          meson install --skip-subprojects -C bbdir
      - name: Install eon [windows]
        if: runner.os == 'Windows'
        shell: pixi run -e dev-xtb bash -e {0}
        run: |
          set -euo pipefail
          export PATH=$(echo "$PATH" | tr ':' '\n' \
            | grep -vE '/usr/bin$|[Mm]ingw|[Ss]trawberry' \
            | paste -sd:)
          if [ -n "${CONDA_PREFIX:-}" ]; then
            export PATH="${CONDA_PREFIX}/Library/bin:${CONDA_PREFIX}/bin:${PATH}"
          fi
          unset LDFLAGS CFLAGS CXXFLAGS FCFLAGS || true
          export CC=cl CXX=cl AR=lib ARFLAGS= FC=flang-new
          if [ -n "${CONDA_PREFIX:-}" ]; then
            # shellcheck source=scripts/ci/win_flang_rt.sh
            source scripts/ci/win_flang_rt.sh
            eon_export_flang_rt "${CONDA_PREFIX}" --required
          fi
          # Shared eoncbase.dll has no eoncbase.lib for plugin links (LNK1181).
          # Same static default as the basic-eon Windows job and the feedstock.
          meson setup --reconfigure bbdir \
            --prefix=$CONDA_PREFIX \
            --buildtype release \
            --libdir=lib \
            --default-library=static \
            -Dwith_xtb=True \
            -Dwith_tests=True
          meson install --skip-subprojects -C bbdir
      - name: Run tests [unix]
        if: runner.os != 'Windows'
        shell: pixi run -e dev-xtb bash -e {0}
        run: |
          meson test -C bbdir --suite eon --print-errorlogs
      - name: Run tests [windows]
        if: runner.os == 'Windows'
        shell: pixi run -e dev-xtb bash -e {0}
        run: |
          set -euo pipefail
          export PATH=$(echo "$PATH" | tr ':' '\n' \
            | grep -vE '/usr/bin$|[Mm]ingw|[Ss]trawberry' \
            | paste -sd:)
          if [ -n "${CONDA_PREFIX:-}" ]; then
            export PATH="${CONDA_PREFIX}/Library/bin:${CONDA_PREFIX}/bin:${PATH}"
          fi
          meson test -C bbdir --suite eon --print-errorlogs
