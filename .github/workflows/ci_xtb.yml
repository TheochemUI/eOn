name: Build and test eonclient with XTB
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
on: [push, pull_request]
jobs:
  build_eon:
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # TODO(rg): Handle the windows-2022 later, issues linking fmt
        # TODO(rg): Handle the aarch64 macos later too
        # TODO(rg): Macos 12 seems to hang a lot, macos-12
        os: [ubuntu-22.04]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e # v0.9.4
        with:
          cache: true
          cache-write: true
          activate-environment: true
          environments: >-
            dev-xtb
      - name: Install cbindgen
        shell: bash
        run: command -v cbindgen || cargo install cbindgen
      - name: Install eon
        shell: pixi run bash -e {0}
        run: |
          meson setup --reconfigure bbdir  \
          --prefix=$CONDA_PREFIX           \
          --buildtype release              \
          --libdir=lib                     \
          -Dwith_xtb=True            \
          -Dwith_tests=True
          meson install --skip-subprojects -C bbdir
      - name: Run tests
        shell: pixi run bash -e {0}
        run: |
          meson test -C bbdir --suite eon --print-errorlogs
