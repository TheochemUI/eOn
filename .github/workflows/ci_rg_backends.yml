name: Build eon with rgmin and rgsaddle
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on: [push, pull_request]
permissions:
  contents: read
env:
  CARGO_C_VERSION: 0.10.23
jobs:
  rg_backends:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            rgsaddle_repo: OmniPotentRPC/rgsaddle
            rgsaddle_rev: 06c55c5c9e8308daac2c1d5860d828ecc9fa7be9
            rgmin_rev: d76539dbe40695c0032e0d96a56e7932f2cc49ab
          - label: LI-NEB
            rgsaddle_repo: HaoZeke/rgsaddle
            rgsaddle_rev: 98344e40112fb17fc69bf7c4e95b789a55e8de6c
            rgmin_rev: f3d18706c2b1ab380fd75f62449fdab46d01f5e2
    name: test (rgmin + rgsaddle, ${{ matrix.label }})
    env:
      RGMIN_REV: ${{ matrix.rgmin_rev }}
      RGSADDLE_REV: ${{ matrix.rgsaddle_rev }}
      RGSADDLE_REPO: ${{ matrix.rgsaddle_repo }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e # v0.9.4
        with:
          cache: true
          cache-write: false
      - name: Install cbindgen
        shell: bash
        run: command -v cbindgen || cargo install cbindgen

      - name: Install the rgmin and rgsaddle C ABI
        shell: pixi run bash -e {0}
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/rgprefix"
          cargo install cargo-c --version "$CARGO_C_VERSION" --locked \
            --root "$RUNNER_TEMP/cargo-c"
          export PATH="$RUNNER_TEMP/cargo-c/bin:$PATH"
          git clone --filter=blob:none https://github.com/OmniPotentRPC/rgmin "$RUNNER_TEMP/rgmin"
          git clone --filter=blob:none "https://github.com/$RGSADDLE_REPO" "$RUNNER_TEMP/rgsaddle"
          git -C "$RUNNER_TEMP/rgmin" checkout --detach "$RGMIN_REV"
          git -C "$RUNNER_TEMP/rgsaddle" checkout --detach "$RGSADDLE_REV"
          (cd "$RUNNER_TEMP/rgmin" && cargo cinstall --release --features capi \
            --prefix="$prefix" --libdir="$prefix/lib")
          # cinstall writes a cbindgen-regenerated rgmin.h that C++ cannot
          # compile; the curated header and its dlpack.h live in include/.
          cp "$RUNNER_TEMP/rgmin/include/rgmin.h" "$prefix/include/"
          cp -r "$RUNNER_TEMP/rgmin/include/dlpack" "$prefix/include/"
          (cd "$RUNNER_TEMP/rgsaddle" && cargo cinstall --release --features capi \
            --prefix="$prefix" --libdir="$prefix/lib")
          echo "RG_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Compile
        env:
          LINEB_FEATURE: ${{ matrix.label == 'LI-NEB' && 'enabled' || 'disabled' }}
        shell: pixi run bash -e {0}
        run: |
          export PKG_CONFIG_PATH="$RG_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          meson setup bbdir --prefix=$CONDA_PREFIX --libdir=lib --buildtype release \
            -Dwith_rgmin=enabled -Dwith_rgsaddle=true
          meson compile -C bbdir
          export LD_LIBRARY_PATH="$RG_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # Strip the terminal colors around each enabled/disabled value.
          features=$(bbdir/client/eonclient --features | sed -E $'s/\x1b\\[[0-9;]*m//g')
          echo "$features"
          grep -q "rgmin minimizers" <<<"$features"
          grep -q "rgsaddle band and min-mode" <<<"$features"
          grep -Fq "rgsaddle fixed-energy LI-NEB: $LINEB_FEATURE" <<<"$features"
          grep -Fq "LI-NEB phase-resolved counts: $LINEB_FEATURE" <<<"$features"

      - name: Verify LI-NEB test registration
        if: matrix.label == 'LI-NEB'
        shell: pixi run bash -e {0}
        run: |
          grep -q "^#define RGSADDLE_HAS_LINEB_ORBIT 1" "$RG_PREFIX/include/rgsaddle.h"
          grep -q -- "-DWITH_RGSADDLE_LINEB" bbdir/compile_commands.json
          meson test -C bbdir --list > "$RUNNER_TEMP/eon-tests"
          grep -w test_lineb_job "$RUNNER_TEMP/eon-tests"
          grep -w test_lineb_seed "$RUNNER_TEMP/eon-tests"

      - name: Run Catch2 unit tests
        shell: pixi run bash -e {0}
        run: |
          export LD_LIBRARY_PATH="$RG_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          meson test -C bbdir --suite eon --print-errorlogs --max-lines 100000
